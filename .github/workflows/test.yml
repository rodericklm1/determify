name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .

    - name: Run unit tests
      run: |
        python -m unittest discover -s tests -p "test_*.py"

    - name: Test CLI self-scan
      run: |
        determify . --fail-on-findings
        determify . --json --fail-on-findings

    - name: Missing path must exit 2
      run: |
        set +e
        determify ./does-not-exist > /dev/null 2>&1
        code=$?
        if [ "$code" -ne 2 ]; then
          echo "expected exit 2 for missing path, got $code"
          exit 1
        fi
        exit 0
